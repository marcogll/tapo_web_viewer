<title>RTSP Viewer</title>
<style>

body{font:15px/1.5 Arial,sans-serif;background:#1a1a1a;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center}
.card{background:#2a2a2a;border-radius:10px;padding:40px;max-width:420px;width:90%;text-align:center}
